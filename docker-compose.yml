version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Medlife_backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medlife-network
    restart: unless-stopped

  frontend:
    build:
      context: ../Clinic_frontend
      dockerfile: Dockerfile
    container_name: Medlife_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medlife-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: medlife_DB
    environment:
      - POSTGRES_DB=medlife_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/storage/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medlife-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medlife_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  medlife-network:
    driver: bridge
